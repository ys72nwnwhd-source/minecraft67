<title>Блок-Квест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;600;700&display=swap&subset=cyrillic">
<style>
/* Layout: блочный игровой мир. Хаб с мирами-карточками, один экран = одно задание, толстые «кубические» кнопки. */
:root {
  --night: #141a2e; --panel: #212a47; --panel2: #2b3660; --edge: #0b0f20;
  --ink: #f4f6ff; --dim: #aab5db; --dark: #10131f;
  --grass: #58cc4a; --grass-d: #2c8a27; --gold: #ffc72c; --gold-d: #b07d00;
  --red: #ff5050; --red-d: #a31d1d; --blue: #3fa7ff; --blue-d: #1c5ea6;
  --purple: #a96bff; --purple-d: #5b30ad; --orange: #ff8a30; --orange-d: #a1520d;
  --teal: #27d6b9; --teal-d: #0e8573; --pink: #ff63ad; --pink-d: #a2276d;
  --lime: #b6e83a; --lime-d: #6c8d0f; --cyan: #4fd8ff; --cyan-d: #157d9e;
  --silver: #d5dcf7; --silver-d: #6f7aa8;
  --font-d: 'Russo One', 'Arial Black', Impact, sans-serif;
  --font-b: 'Rubik', 'Segoe UI', Arial, sans-serif;
  color-scheme: dark;
}
.c-orange { --c: var(--orange); --cd: var(--orange-d); }
.c-blue { --c: var(--blue); --cd: var(--blue-d); }
.c-purple { --c: var(--purple); --cd: var(--purple-d); }
.c-teal { --c: var(--teal); --cd: var(--teal-d); }
.c-grass { --c: var(--grass); --cd: var(--grass-d); }
.c-pink { --c: var(--pink); --cd: var(--pink-d); }
.c-red { --c: var(--red); --cd: var(--red-d); }
.c-gold { --c: var(--gold); --cd: var(--gold-d); }
.c-lime { --c: var(--lime); --cd: var(--lime-d); }
.c-cyan { --c: var(--cyan); --cd: var(--cyan-d); }
.c-silver { --c: var(--silver); --cd: var(--silver-d); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  font: 500 16px/1.45 var(--font-b); color: var(--ink);
  background-color: var(--night);
  background-image: linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
  background-size: 48px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
#app { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-d); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dim { color: var(--dim); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1 1 auto; }

/* кнопки-блоки */
.btn {
  font-family: var(--font-d); font-size: 1.05rem; letter-spacing: .02em; color: var(--dark);
  background: var(--c, var(--grass)); border: 0; border-bottom: 6px solid var(--cd, var(--grass-d));
  border-radius: 6px; padding: .65em 1.1em; cursor: pointer;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.35); transition: transform .06s;
  display: inline-flex; align-items: center; justify-content: center; gap: .5em; text-align: center;
}
.btn:active { transform: translateY(4px); border-bottom-width: 2px; }
.btn[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
.btn.ghost { background: var(--panel2); color: var(--ink); border-bottom-color: var(--edge); box-shadow: inset 0 3px 0 rgba(255,255,255,.08); }
.btn.sm { font-size: .88rem; padding: .45em .8em; border-bottom-width: 4px; }
.btn.big { font-size: 1.25rem; padding: .8em 1.4em; }
.btn.red { --c: var(--red); --cd: var(--red-d); }
.btn.gold { --c: var(--gold); --cd: var(--gold-d); }
.btn.blue { --c: var(--blue); --cd: var(--blue-d); }

.panel { background: var(--panel); border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 16px; }
.chip { display: inline-flex; align-items: center; gap: .45em; background: var(--panel); border-bottom: 4px solid var(--edge); border-radius: 6px; padding: .35em .7em; font-family: var(--font-d); }
.ci { display: inline-block; width: 1.05em; height: 1.05em; background: var(--gold); border: .14em solid var(--gold-d); box-shadow: inset .12em .12em 0 #fff2a8; vertical-align: -.15em; }
.x { font-style: italic; font-weight: 700; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .15em; font-family: var(--font-d); }
.fr i { font-style: normal; padding: 0 .25em .08em; border-bottom: .09em solid currentColor; }
.fr b { font-weight: 400; padding-top: .08em; }

/* шапка */
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font-family: var(--font-d); font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1; }
.brand span { color: var(--grass); }
.brand small { display: block; font: 500 .8rem var(--font-b); color: var(--dim); letter-spacing: 0; margin-top: 4px; }

/* герой */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 0 24px; align-items: end; background: #3a86e6; border-radius: 8px 8px 0 0; padding: 18px 20px 0; position: relative; overflow: hidden; }
.hero .who { padding-bottom: 20px; color: #fff; min-width: 0; }
.hero .name { font-family: var(--font-d); font-size: clamp(1.3rem, 4vw, 1.9rem); }
.hero .rank { color: #dcecff; margin-bottom: 10px; }
.stage { width: 112px; }
.stage svg { display: block; width: 100%; height: auto; }
.ground { grid-column: 1 / -1; height: 44px; margin: 0 -20px; background: linear-gradient(var(--grass) 0 14px, transparent 14px), repeating-linear-gradient(90deg, #8a5632 0 36px, #7a4a2a 36px 72px); box-shadow: inset 0 14px 0 var(--grass-d); }
.heroNav { display: flex; gap: 10px; flex-wrap: wrap; background: var(--panel); border-radius: 0 0 8px 8px; padding: 12px 16px; border-bottom: 6px solid var(--edge); }
.xp { display: flex; gap: 3px; margin: 6px 0 4px; }
.xp i { flex: 1; height: 12px; background: rgba(0,0,0,.35); max-width: 22px; }
.xp i.on { background: var(--gold); box-shadow: inset 0 3px 0 rgba(255,255,255,.4); }

/* миры */
.sec { margin: 26px 0 12px; font-size: 1.3rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.wcard { text-align: left; cursor: pointer; background: var(--panel); border: 0; border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 14px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; transition: transform .1s, background .1s; min-width: 0; }
.wcard:hover { transform: translateY(-3px); background: var(--panel2); }
.wcard:active { transform: translateY(2px); }
.glyph { width: 64px; height: 64px; display: grid; place-items: center; background: var(--c); border-bottom: 5px solid var(--cd); border-radius: 6px; box-shadow: inset 0 3px 0 rgba(255,255,255,.4); color: var(--dark); font-family: var(--font-d); font-size: 1.6rem; line-height: 1; }
.glyph.s3 { font-size: 1.15rem; }
.glyph.xl { width: 84px; height: 84px; font-size: 2.2rem; }
.wcard h3 { font-size: 1.05rem; line-height: 1.2; }
.wcard p { margin: 2px 0 6px; font-size: .86rem; color: var(--dim); line-height: 1.3; }
.mini { display: flex; gap: 3px; align-items: center; font-size: .82rem; color: var(--dim); }
.mini .bar { flex: 1; height: 8px; background: rgba(0,0,0,.4); max-width: 120px; }
.mini .bar i { display: block; height: 100%; background: var(--c); }
.blitz { grid-column: 1 / -1; }
.blitz .wcard { width: 100%; background: linear-gradient(90deg, #5a1d25, #3a1d52); }

/* уровни мира */
.lv { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
.lvc { background: var(--panel); border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.lvc h3 { font-size: 1.2rem; }
.lvc.rec { outline: 3px dashed var(--c); outline-offset: 3px; }
.stars { display: inline-flex; gap: 4px; }
.star { width: 28px; height: 28px; display: grid; place-items: center; background: rgba(0,0,0,.4); color: transparent; font-size: 18px; line-height: 1; border-radius: 4px; }
.star.on { background: var(--gold); color: var(--dark); border-bottom: 3px solid var(--gold-d); }
.stars.lg .star { width: 56px; height: 56px; font-size: 36px; }
.stars.lg .star.on { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars.lg .star.on:nth-child(2) { animation-delay: .25s; }
.stars.lg .star.on:nth-child(3) { animation-delay: .5s; }

/* игра */
.play { max-width: 640px; margin: 0 auto; }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.hearts { display: flex; gap: 4px; }
.hearts svg { width: 26px; height: 22px; display: block; }
.prog { flex: 1 1 140px; display: flex; gap: 3px; min-width: 120px; }
.prog i { flex: 1; height: 16px; background: rgba(0,0,0,.4); }
.prog i.on { background: var(--c); box-shadow: inset 0 4px 0 rgba(255,255,255,.4); animation: pop .3s; }
.combo { font-family: var(--font-d); color: var(--dark); background: var(--orange); border-bottom: 4px solid var(--orange-d); border-radius: 6px; padding: .2em .6em; }
.qcard { background: var(--panel); border-bottom: 6px solid var(--edge); border-top: 8px solid var(--c); border-radius: 8px; padding: 16px; }
.qtag { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.q { font-family: var(--font-d); font-size: clamp(1.35rem, 5.2vw, 2rem); line-height: 1.3; overflow-wrap: anywhere; }
.q.long { font-family: var(--font-b); font-weight: 600; font-size: clamp(1.1rem, 4.2vw, 1.35rem); line-height: 1.45; }
.figwrap { margin-top: 12px; display: flex; justify-content: center; overflow-x: auto; }
.fig { width: 100%; max-width: 320px; height: auto; background: rgba(0,0,0,.25); border-radius: 6px; }
.fig.small { max-width: 190px; }
.fig text { fill: #f4f6ff; font: 600 15px var(--font-b); }
.fig text.sm { font-size: 12px; fill: #aab5db; }
.fields { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld .lab { font-size: .85rem; color: var(--dim); }
.fld .box { display: flex; align-items: center; gap: 8px; }
.fld .val { min-width: 130px; min-height: 58px; padding: 0 14px; display: flex; align-items: center; font-family: var(--font-d); font-size: 1.9rem; background: #0e1326; border: 4px solid #3a456f; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
.fld.act .val { border-color: var(--c); box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
.fld .val.empty::after { content: ''; width: 3px; height: 1.5em; background: var(--dim); animation: blink 1s steps(2) infinite; }
.fld.act .val:not(.empty)::after { content: ''; width: 3px; height: 1.5em; background: var(--c); margin-left: 3px; animation: blink 1s steps(2) infinite; }
.unit { color: var(--dim); font-size: 1.05rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 16px; }
.choices .btn { font-size: 1.15rem; min-height: 58px; }
.hintbox { margin-top: 12px; background: rgba(79,216,255,.12); border-left: 6px solid var(--cyan); padding: 10px 12px; border-radius: 0 6px 6px 0; }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: 6px; font-weight: 600; }
.fb.ok { background: rgba(88,204,74,.18); border-left: 8px solid var(--grass); }
.fb.bad { background: rgba(255,80,80,.16); border-left: 8px solid var(--red); }
.fb b { font-family: var(--font-d); font-weight: 400; font-size: 1.25rem; display: block; }
.fb .ex { font-weight: 500; color: var(--ink); margin-top: 6px; }
.fb .ans { font-family: var(--font-d); font-size: 1.3rem; color: var(--gold); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.pad .btn { min-height: 60px; font-size: 1.5rem; --c: var(--silver); --cd: var(--silver-d); padding: 0; }
.pad .btn.k-ok { --c: var(--grass); --cd: var(--grass-d); font-size: 1.1rem; }
.pad .btn.k-back { --c: var(--orange); --cd: var(--orange-d); }
.tools { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.nextbar { margin-top: 14px; display: flex; }
.nextbar .btn { flex: 1; }
.flash { margin-top: 10px; min-height: 1.6em; font-weight: 700; }
.flash.ok { color: var(--grass); }
.flash.bad { color: var(--orange); }
.timer { flex: 1 1 160px; height: 18px; background: rgba(0,0,0,.45); position: relative; min-width: 120px; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--red); box-shadow: inset 0 4px 0 rgba(255,255,255,.35); }
.tnum { font-family: var(--font-d); font-size: 1.4rem; min-width: 2.4ch; text-align: right; font-variant-numeric: tabular-nums; }
.shake { animation: shake .35s; }
.floaty { position: fixed; z-index: 30; pointer-events: none; font-family: var(--font-d); font-size: 1.6rem; color: var(--gold); text-shadow: 0 3px 0 #000; animation: floaty .9s ease-out forwards; }

/* итог и сундук */
.result { max-width: 640px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.result h2 { font-size: clamp(1.7rem, 6vw, 2.4rem); }
.stat { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stat .chip { min-width: 110px; flex-direction: column; gap: 0; padding: .5em .9em; }
.stat .chip small { font: 500 .78rem var(--font-b); color: var(--dim); }
.stat .chip b { font-weight: 400; font-size: 1.5rem; }
.chest { width: 150px; }
.chest svg { width: 100%; height: auto; display: block; overflow: visible; }
.chest .lid { transform-origin: 20px 40px; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.chest.open .lid { transform: rotate(-38deg) translate(-4px, -4px); }
.chest.open .glow { opacity: 1; }
.chest .glow { opacity: 0; transition: opacity .4s .2s; }
.chest.wob { animation: wob .5s infinite; }
.lvup { background: var(--gold); color: var(--dark); border-bottom: 5px solid var(--gold-d); border-radius: 6px; padding: .4em 1em; font-family: var(--font-d); animation: pop .5s; }

/* магазин / награды */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.skin { background: var(--panel); border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.skin.eq { outline: 3px solid var(--grass); }
.skin .pv { width: 80px; background: rgba(0,0,0,.25); border-radius: 6px; padding: 6px; }
.skin .pv svg { display: block; width: 100%; height: auto; }
.prize { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 14px; }
.prize + .prize { margin-top: 10px; }
.prize .t { flex: 1 1 200px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

/* репетитор */
.tut { display: grid; gap: 16px; }
.tut h3 { font-size: 1.15rem; margin-bottom: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td { padding: 8px 6px; text-align: left; border-bottom: 2px solid rgba(255,255,255,.08); vertical-align: middle; }
.tbl th { color: var(--dim); font-weight: 500; font-size: .8rem; }
.tscroll { overflow-x: auto; }
.acc { display: inline-block; width: 90px; height: 10px; background: rgba(0,0,0,.45); vertical-align: middle; margin-right: 8px; }
.acc i { display: block; height: 100%; }
.mis { display: grid; gap: 8px; }
.mis > div { background: rgba(0,0,0,.25); border-left: 6px solid var(--red); padding: 8px 12px; border-radius: 0 6px 6px 0; overflow-wrap: anywhere; font-size: .92rem; }
.set { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tog { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,.3); border-radius: 6px; border: 3px solid transparent; font-weight: 600; }
.tog[aria-pressed="true"] { border-color: var(--grass); }
.tog i { width: 16px; height: 16px; background: #3a456f; display: inline-block; }
.tog[aria-pressed="true"] i { background: var(--grass); }
input[type="text"], input[type="number"] { font: inherit; color: var(--ink); background: #0e1326; border: 3px solid #3a456f; border-radius: 6px; padding: 8px 10px; min-width: 0; }
input[type="number"] { width: 90px; }
.prow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.prow input[type="text"] { flex: 1 1 200px; }

/* окно и подсказка */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,20,.75); display: grid; place-items: center; padding: 20px; }
.modal .box { background: var(--panel); border-bottom: 6px solid var(--edge); border-radius: 8px; padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--dark); font-weight: 700; padding: .6em 1.1em; border-radius: 6px; border-bottom: 4px solid var(--silver-d); max-width: calc(100vw - 32px); text-align: center; animation: pop .25s; }

@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes floaty { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
@keyframes wob { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

@media (max-width: 520px) {
  .hero { grid-template-columns: 90px 1fr; gap: 0 14px; }
  .stage { width: 90px; }
  .grid { grid-template-columns: 1fr; }
  .fld .val { min-width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.fld .val.ok { border-color: var(--grass); background: rgba(88,204,74,.14); }
.fld .val.bad { border-color: var(--red); background: rgba(255,80,80,.12); }
.tut { grid-template-columns: minmax(0, 1fr); }
.tut > * { min-width: 0; }
.prog { flex: 1 1 70px; min-width: 70px; }
@media (max-width: 520px) { .hud { gap: 8px; } .hearts svg { width: 22px; height: 19px; } }
</style>
<div id="app"></div>
<script>
(function (root) {
'use strict';
var rnd = function (a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; };
var pick = function (a) { return a[rnd(0, a.length - 1)]; };
var NB = ' ';
var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB); };
var pl = function (n, f) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
};
var np = function (n, f) { return fmt(n) + NB + pl(n, f); };
var frac = function (n, d) { return '<span class="fr"><i>' + n + '</i><b>' + d + '</b></span>'; };
var X = '<i class="x">x</i>';
var shuffle = function (a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};
var num = function (q, ans, expl, x) {
  x = x || {};
  return { type: 'num', q: q, ans: [].concat(ans), fields: x.fields || [{ label: '', unit: x.unit || '' }],
    expl: expl || '', fig: x.fig || '', hint: x.hint || '' };
};
var ch = function (q, choices, ans, expl, x) {
  x = x || {};
  return { type: 'choice', q: q, choices: choices, ans: [ans], fields: [], expl: expl || '', fig: x.fig || '', hint: x.hint || '' };
};

/* ---------- слова для задач ---------- */
var KR = ['кристалл', 'кристалла', 'кристаллов'], MN = ['монета', 'монеты', 'монет'],
  BL = ['блок', 'блока', 'блоков'], AL = ['алмаз', 'алмаза', 'алмазов'],
  FK = ['факел', 'факела', 'факелов'], YA = ['ящик', 'ящика', 'ящиков'],

    if (S.settings.hearts) { hs = '<div class="hearts" role="img" aria-label="Сердец: ' + r.hearts + '">'; for (i = 0; i < 3; i++) hs += heart(i < r.hearts); hs += '</div>'; }
    var pr = ''; for (i = 0; i < r.n; i++) pr += '<i class="' + (i < r.done ? 'on' : '') + '"></i>';
    top = hs + '<div class="prog" role="img" aria-label="Выполнено ' + r.done + ' из ' + r.n + '">' + pr + '</div><span class="chip">' + CI + ' ' + r.coins + '</span>';
  }
  if (r.streak >= 3) top += '<span class="combo">Комбо ×' + r.streak + '</span>';
  var ans = '';
  if (t.type === 'num') ans = '<div class="fields" id="fields">' + fieldsHtml() + '</div>';
  else {
    ans = '<div class="choices">' + t.choices.map(function (c) {
      var st = '';
      if (r.phase !== 'ask') { if (c === t.ans[0]) st = ' style="--c:var(--grass);--cd:var(--grass-d)"'; else if (c === r.choice) st = ' style="--c:var(--red);--cd:var(--red-d)"'; }
      return '<button class="btn ghost" data-act="choice" data-v="' + esc(c) + '"' + st + (r.phase !== 'ask' ? ' disabled' : '') + '>' + esc(c) + '</button>';
    }).join('') + '</div>';
  }
  var fb = '', tools = '', pad = '', next = '';
  if (r.phase === 'ask' && !r.blitz && S.settings.hints && t.hint) tools = '<div class="tools"><button class="btn ghost sm" data-act="hint">' + (r.hintOpen ? 'Скрыть подсказку' : 'Подсказка') + '</button></div>';
  if (r.phase === 'ask' && r.hintOpen && t.hint) tools += '<div class="hintbox">' + esc(t.hint) + '</div>';
  if (r.phase === 'right' && !r.blitz) fb = '<div class="fb ok" role="status"><b>' + r.praise + '</b>+' + r.gain + ' ' + CI + (r.quick ? ' · быстро, бонус!' : '') + '</div>';
  if (r.phase === 'wrong' && !r.blitz) fb = '<div class="fb bad" role="status"><b>Почти!</b>Правильный ответ: <span class="ans">' + ansText(t) + '</span>' + (t.expl ? '<div class="ex">' + t.expl + '</div>' : '') + '<div class="ex dim" style="margin-top:6px">' + (S.settings.hearts && r.hearts <= 0 ? 'Сердца закончились.' : 'Это задание вернётся позже с другими числами.') + '</div></div>';
  if (r.phase === 'ask' && t.type === 'num') {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (k) { return '<button class="btn" data-act="key" data-k="' + k + '">' + k + '</button>'; }).join('');
    pad = '<div class="pad">' + keys + '<button class="btn k-back" data-act="key" data-k="back" aria-label="Стереть">⌫</button><button class="btn" data-act="key" data-k="0">0</button><button class="btn k-ok" data-act="key" data-k="ok">' + (r.blitz ? 'Ответ' : 'Проверить') + '</button></div>';
  }
  if (r.phase !== 'ask' && !r.blitz) next = '<div class="nextbar"><button class="btn big" data-act="next">' + ((r.phase === 'wrong' && S.settings.hearts && r.hearts <= 0) ? 'Дальше' : 'Дальше →') + '</button></div>';
  var fl = (r.blitz && r.flash) ? '<div class="flash ' + (r.flash.ok ? 'ok' : 'bad') + '" role="status">' + r.flash.t + '</div>' : (r.blitz ? '<div class="flash"></div>' : '');
  var long = strip(t.q).length > 70 ? ' long' : '';
  app.innerHTML = '<div class="play c-' + w.c + '"><div class="hud"><button class="btn ghost sm" data-act="quit">✕ Выйти</button>' + top + '</div>' +
    '<div class="qcard" id="qcard"><div class="qtag">' + esc(w.name) + (r.blitz ? '' : ' · ' + LVN[r.lv]) + '</div><div class="q' + long + '">' + t.q + '</div>' +
    (t.fig ? '<div class="figwrap">' + t.fig + '</div>' : '') + ans + tools + fb + fl + '</div>' + pad + next + '</div>';
  if (r.phase === 'wrong') { var qc = document.getElementById('qcard'); if (qc) qc.classList.add('shake'); }
}

/* ---------- ввод ---------- */
function press(k) {
  var r = ui.run; if (!r || r.phase !== 'ask' || r.cur.type !== 'num') return;
  var v = r.fields[r.active];
  if (k === 'back') v = v.slice(0, -1);
  else if (k === 'ok') {
    if (r.fields.every(function (f) { return f !== ''; })) { submit(); return; }
    if (r.fields[r.active] !== '') r.active = r.fields.findIndex(function (f) { return f === ''; });
    paintFields(); return;
  } else if (/^\d$/.test(k)) { if (v.length < 8) v = (v === '0' ? '' : v) + k; }
  r.fields[r.active] = v; paintFields();
  if (r.blitz && r.fields.length === 1 && v.length === String(r.cur.ans[0]).length) submit();
}
function submit() {
  var r = ui.run; if (!r || r.phase !== 'ask') return;
  var t = r.cur, ok, given;
  if (t.type === 'num') {
    if (r.fields.some(function (f) { return f === ''; })) return;
    given = r.fields.map(Number); ok = given.every(function (v, i) { return v === t.ans[i]; });
  } else { given = [r.choice]; ok = r.choice === t.ans[0]; }
  var sec = (Date.now() - r.t0) / 1000;
  var st = S.stats[r.wid] || (S.stats[r.wid] = { ok: 0, bad: 0 });
  r.lastOk = ok;
  if (ok) {
    st.ok++; r.streak++; r.ok++; r.done++;
    var c = 2; if (r.streak >= 3) c++; if (r.streak >= 5) c++;
    r.quick = sec < 10 && !r.hintUsed; if (r.quick) c++;
    if (r.blitz) { c = 1; r.quick = false; }
    r.gain = c; r.coins += c; S.coins += c; S.xp += r.blitz ? 2 : 5;
    r.praise = r.streak >= 5 ? 'Серия ×' + r.streak + '!' : PRAISE[rnd(0, PRAISE.length - 1)];
    r.phase = 'right'; snd('ok');
  } else {
    st.bad++; r.streak = 0; r.bad++;
    if (!r.blitz) { if (S.settings.hearts) r.hearts--; r.queue.push(r.curGen); }
    S.mistakes.unshift({ w: r.blitz ? 'Быстрый раунд' : WID[r.wid].name, q: strip(t.q) + (t.fig ? ' [рисунок]' : ''), a: strip(ansText(t)), g: t.type === 'num' ? given.join(' / ') : String(given[0]), t: Date.now() });
    S.mistakes = S.mistakes.slice(0, 30);
    r.phase = 'wrong'; snd('bad');
  }
  save();
  if (r.blitz) {
    r.flash = ok ? { ok: true, t: 'Верно!' } : { ok: false, t: 'Было: ' + ansText(t) };
    newTask(); rPlay(); if (ok) floatText('+1');
    return;
  }
  rPlay();
  if (ok) { floatText('+' + r.gain); r.tm = setTimeout(next, 1300); }
}
function next() {
  var r = ui.run; if (!r || r.phase === 'ask') return;
  clearTimeout(r.tm);
  if (!r.blitz && S.settings.hearts && r.hearts <= 0) return finish(false);
  if (!r.blitz && r.done >= r.n) return finish(true);
  newTask(); rPlay();
}
function finish(win) {
  var r = ui.run; clearTimeout(r.tm); if (ui.timer) { clearInterval(ui.timer); ui.timer = null; }
  var stars = 0, bonus = 0, record = false, chest = false;
  if (r.blitz) {
    if (r.ok > S.blitzBest) { S.blitzBest = r.ok; record = r.ok > 0; }
    chest = r.ok >= 8;
  } else if (win) {
    stars = r.bad === 0 ? 3 : (r.bad <= 2 ? 2 : 1); bonus = stars * 3;
    var a = S.stars[r.wid] || (S.stars[r.wid] = [0, 0, 0]); a[r.lv] = Math.max(a[r.lv] || 0, stars);
    S.coins += bonus; S.xp += 20; chest = true;
  }
  save(); snd(win && (stars || chest) ? 'win' : 'bad');
  go('result', { res: { win: win, stars: stars, bonus: bonus, chest: chest, opened: false, reward: 0, record: record, lvup: level() > r.startLvl } });
}

/* ---------- итог ---------- */
function rResult() {
  var r = ui.run, x = ui.res, w = r.blitz ? { name: 'Быстрый раунд', c: 'red' } : WID[r.wid], head, sub, st = '';
  if (r.blitz) { head = 'Время вышло!'; sub = 'Решено верно: ' + r.ok + (x.record ? '. Новый рекорд!' : '. Рекорд: ' + S.blitzBest); }
  else if (x.win) { head = 'Миссия пройдена!'; for (var i = 0; i < 3; i++) st += '<span class="star' + (x.stars > i ? ' on' : '') + '">★</span>'; sub = x.stars === 3 ? 'Без единой ошибки. Мощно!' : (x.stars === 2 ? 'Почти идеально.' : 'Пройдено. В следующий раз попробуй без ошибок.'); }
  else { head = 'Сердца закончились'; sub = 'Ничего страшного. Монеты, что ты собрал, остались при тебе. Попробуй ещё раз.'; }
  var chest = '';
  if (x.chest) chest = '<div class="chest' + (x.opened ? ' open' : ' wob') + '">' + chestSvg() + '</div>' +
    (x.opened ? '<div class="chip" style="font-size:1.4rem">+' + x.reward + ' ' + CI + '</div>' : '<button class="btn gold big" data-act="chest">Открыть сундук</button>');
  var btns = '<div class="row" style="justify-content:center">' + (r.blitz ? '<button class="btn" data-act="blitz">Ещё раз</button>' : '<button class="btn" data-act="start" data-lv="' + r.lv + '" data-id="' + r.wid + '">Ещё раз</button>' + (x.win && r.lv < 2 ? '<button class="btn blue" data-act="start" data-lv="' + (r.lv + 1) + '" data-id="' + r.wid + '">Следующий уровень</button>' : '')) + '<button class="btn ghost" data-act="hub">В меню</button></div>';
  app.innerHTML = '<div class="result c-' + w.c + '"><h2>' + head + '</h2>' + (st ? '<div class="stars lg">' + st + '</div>' : '') + '<p style="margin:0" class="dim">' + sub + '</p>' + (x.lvup ? '<div class="lvup">Новый уровень: ' + level() + '!</div>' : '') +
    '<div class="stat"><div class="chip"><small>Верно</small><b>' + r.ok + '</b></div><div class="chip"><small>Ошибки</small><b>' + r.bad + '</b></div><div class="chip"><small>Монеты</small><b>' + (r.coins + x.bonus) + '</b></div></div>' +
    (x.bonus ? '<div class="dim">Бонус за звёзды: +' + x.bonus + '</div>' : '') + chest + btns + '</div>';
}

/* ---------- магазин и награды ---------- */
function rShop() {
  var cards = SKINS.map(function (s) {
    var own = S.owned.indexOf(s.id) >= 0, eq = S.skin === s.id, btn;
    if (eq) btn = '<button class="btn ghost sm" disabled>Надето</button>';
    else if (own) btn = '<button class="btn sm" data-act="equip" data-id="' + s.id + '">Надеть</button>';
    else btn = '<button class="btn gold sm" data-act="buy" data-id="' + s.id + '"' + (S.coins < s.p ? ' disabled' : '') + '>' + s.p + ' ' + CI + '</button>';
    return '<div class="skin' + (eq ? ' eq' : '') + '"><div class="pv">' + avatar(s.id) + '</div><b style="font-family:var(--font-d);font-weight:400">' + esc(s.n) + '</b>' + btn + '</div>';
  }).join('');
  app.innerHTML = '<div class="head"><button class="btn ghost sm" data-act="hub">← В меню</button><h1 style="font-size:1.6rem">Магазин скинов</h1><div class="sp"></div><span class="chip">' + CI + ' ' + S.coins + '</span></div><div class="shop">' + cards + '</div>';
}
function rPrizes() {
  var list = S.prizes.length ? S.prizes.map(function (p, i) {
    return '<div class="prize"><div class="t">' + esc(p.name) + '</div><span class="chip">' + p.cost + ' ' + CI + '</span><button class="btn gold sm" data-act="claim" data-i="' + i + '"' + (S.coins < p.cost ? ' disabled' : '') + '>Получить</button></div>';
  }).join('') : '<p class="dim">Пока наград нет. Репетитор может добавить их в своём разделе.</p>';
  var done = S.redeemed.length ? '<div class="sec"><h2 style="font-size:1.1rem">Уже получено</h2></div><div class="dim">' + S.redeemed.slice(0, 8).map(function (p) { return esc(p.name); }).join(' · ') + '</div>' : '';
  app.innerHTML = '<div class="head"><button class="btn ghost sm" data-act="hub">← В меню</button><h1 style="font-size:1.6rem">Награды</h1><div class="sp"></div><span class="chip">' + CI + ' ' + S.coins + '</span></div><p class="dim" style="margin-top:0">Монеты можно обменять на настоящие награды. Нажми «Получить» и скажи об этом репетитору.</p>' + list + done;
}

/* ---------- репетитор ---------- */
function fmtT(ts) { try { return new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function rTutor() {
  var rows = WORLDS.concat([{ id: 'blitz', name: 'Быстрый раунд', c: 'red' }]).map(function (w) {
    var s = S.stats[w.id] || { ok: 0, bad: 0 }, tot = s.ok + s.bad, pc = tot ? Math.round(s.ok / tot * 100) : 0, col = pc >= 80 ? 'var(--grass)' : (pc >= 60 ? 'var(--gold)' : 'var(--red)');
    return '<tr><td>' + esc(w.name) + '</td><td>' + tot + '</td><td>' + (tot ? '<span class="acc"><i style="width:' + pc + '%;background:' + col + '"></i></span>' + pc + '%' : '—') + '</td><td>' + (w.id === 'blitz' ? 'рекорд ' + S.blitzBest : '★ ' + totalStars(w.id) + '/9') + '</td></tr>';
  }).join('');
  var weak = WORLDS.map(function (w) { var s = S.stats[w.id] || { ok: 0, bad: 0 }, tot = s.ok + s.bad; return { n: w.name, tot: tot, pc: tot ? s.ok / tot : 1 }; })
    .filter(function (x) { return x.tot >= 6 && x.pc < 0.8; }).sort(function (a, b) { return a.pc - b.pc; }).slice(0, 3);
  var weakH = weak.length ? '<p style="margin:0 0 6px"><b>Что повторить:</b> ' + weak.map(function (x) { return esc(x.n) + ' (' + Math.round(x.pc * 100) + '%)'; }).join(', ') + '</p>' : '<p class="dim" style="margin:0 0 6px">Слабых тем пока не видно: нужно хотя бы 6 заданий в теме и точность ниже 80%.</p>';
  var mis = S.mistakes.length ? '<div class="mis">' + S.mistakes.slice(0, 12).map(function (m) { return '<div><b>' + esc(m.w) + '</b> · ' + fmtT(m.t) + '<br>' + esc(m.q) + '<br><span class="dim">Ответил: ' + esc(m.g) + '. Верно: </span><b>' + esc(m.a) + '</b></div>'; }).join('') + '</div>' : '<p class="dim" style="margin:0">Ошибок пока нет.</p>';
  var T = function (k, label) { return '<button class="tog" data-act="tog" data-k="' + k + '" aria-pressed="' + (S.settings[k] ? 'true' : 'false') + '"><i></i>' + label + '</button>'; };
  var nb = [6, 8, 10, 12].map(function (n) { return '<button class="btn sm' + (S.settings.n === n ? '' : ' ghost') + '" data-act="setn" data-n="' + n + '">' + n + '</button>'; }).join('');
  var pr = S.prizes.map(function (p, i) {
    return '<div class="prow"><input type="text" value="' + esc(p.name) + '" data-pi="' + i + '" data-f="name" aria-label="Название награды"><input type="number" min="1" max="999" value="' + p.cost + '" data-pi="' + i + '" data-f="cost" aria-label="Цена в монетах"><button class="btn ghost sm" data-act="delprize" data-i="' + i + '">Удалить</button></div>';
  }).join('');
  var rd = S.redeemed.length ? '<div class="mis">' + S.redeemed.slice(0, 8).map(function (p) { return '<div style="border-color:var(--gold)">' + esc(p.name) + ' · ' + p.cost + ' монет · ' + fmtT(p.t) + '</div>'; }).join('') + '</div>' : '<p class="dim" style="margin:0">Награды ещё не заказывали.</p>';
  app.innerHTML = '<div class="head"><button class="btn ghost sm" data-act="hub">← В меню</button><h1 style="font-size:1.6rem">Репетитор</h1><div class="sp"></div><span class="chip">' + CI + ' ' + S.coins + '</span></div>' +
    '<div class="tut">' +
    '<div class="panel"><h3>Успехи по темам</h3>' + weakH + '<div class="tscroll"><table class="tbl"><thead><tr><th>Тема</th><th>Решено</th><th>Точность</th><th>Прогресс</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="panel"><h3>Последние ошибки</h3>' + mis + '</div>' +
    '<div class="panel"><h3>Монеты за старание</h3><div class="row"><button class="btn gold sm" data-act="grant" data-n="5">+5</button><button class="btn gold sm" data-act="grant" data-n="10">+10</button><button class="btn gold sm" data-act="grant" data-n="20">+20</button><span class="dim">Выдай за внимание, усилие, красивое оформление решения.</span></div></div>' +
    '<div class="panel"><h3>Настройки</h3><div class="set">' + T('hearts', 'Сердца (3 ошибки — конец миссии)') + T('hints', 'Кнопка «Подсказка»') + T('sound', 'Звук') + '</div><div class="row" style="margin-top:12px"><span>Заданий в миссии:</span>' + nb + '</div></div>' +
    '<div class="panel"><h3>Награды за монеты</h3><p class="dim" style="margin-top:0">Это примеры. Измени на то, что реально мотивирует ученика.</p>' + pr + '<button class="btn sm" data-act="addprize">+ Добавить награду</button><h3 style="margin-top:16px">Заказанные награды</h3>' + rd + '</div>' +
    '<div class="panel"><h3>Сброс</h3><p class="dim" style="margin-top:0">Прогресс хранится в браузере на этом устройстве. Если открыть игру на другом устройстве, начнётся с нуля.</p><button class="btn red sm" data-act="reset">' + (ui.resetArm ? 'Точно удалить весь прогресс?' : 'Сбросить прогресс') + '</button></div></div>';
}

/* ---------- события ---------- */
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var d = b.dataset, r = ui.run;
  switch (d.act) {
    case 'hub': go('hub'); break;
    case 'world': go('world', { wid: d.id }); break;
    case 'start': if (d.id) ui.wid = d.id; startRun(ui.wid, +d.lv); break;
    case 'blitz': startBlitz(); break;
    case 'key': press(d.k); break;
    case 'fld': if (r && r.phase === 'ask') { r.active = +d.i; paintFields(); } break;
    case 'choice': if (r && r.phase === 'ask') { r.choice = d.v; submit(); } break;
    case 'hint': r.hintOpen = !r.hintOpen; if (r.hintOpen) r.hintUsed = true; rPlay(); break;
    case 'next': next(); break;
    case 'quit': ui.modal = { t: 'Выйти из миссии?', p: 'Прогресс этой миссии пропадёт. Монеты, которые ты уже получил, останутся.', yes: 'Выйти', act: 'quitgo' }; render(); break;
    case 'quitgo': if (r && r.tm) clearTimeout(r.tm); go(r && r.blitz ? 'hub' : 'world', { wid: r && r.wid }); break;
    case 'modalno': ui.modal = null; render(); break;
    case 'chest': {
      var x = ui.res, roll = Math.random(); x.reward = roll < 0.12 ? rnd(40, 70) : rnd(8, 25); x.opened = true; S.coins += x.reward; save(); snd('chest'); rResult(); break;
    }
    case 'shop': go('shop'); break;
    case 'prizes': go('prizes'); break;
    case 'tutor': go('tutor'); break;
    case 'buy': { var s = SK[d.id]; if (s && S.coins >= s.p && S.owned.indexOf(s.id) < 0) { S.coins -= s.p; S.owned.push(s.id); S.skin = s.id; save(); snd('buy'); toast('Куплено: ' + s.n); rShop(); } break; }
    case 'equip': if (S.owned.indexOf(d.id) >= 0) { S.skin = d.id; save(); rShop(); } break;
    case 'claim': { var p = S.prizes[+d.i]; if (p && S.coins >= p.cost) { S.coins -= p.cost; S.redeemed.unshift({ name: p.name, cost: p.cost, t: Date.now() }); save(); snd('buy'); toast('Награда заказана. Скажи об этом репетитору'); rPrizes(); } break; }
    case 'grant': S.coins += +d.n; save(); toast('+' + d.n + ' монет'); rTutor(); break;
    case 'tog': S.settings[d.k] = !S.settings[d.k]; save(); rTutor(); break;
    case 'setn': S.settings.n = +d.n; save(); rTutor(); break;
    case 'addprize': S.prizes.push({ name: 'Новая награда', cost: 20 }); save(); rTutor(); break;
    case 'delprize': S.prizes.splice(+d.i, 1); save(); rTutor(); break;
    case 'reset':
      if (!ui.resetArm) { ui.resetArm = true; rTutor(); setTimeout(function () { if (ui.resetArm) { ui.resetArm = false; if (ui.screen === 'tutor') rTutor(); } }, 5000); }
      else { S = defaults(); save(); ui.resetArm = false; go('hub'); toast('Прогресс сброшен'); }
      break;
  }
});
app.addEventListener('change', function (e) {
  var t = e.target, i = t.dataset && t.dataset.pi; if (i === undefined || !S.prizes[+i]) return;
  if (t.dataset.f === 'name') S.prizes[+i].name = t.value.slice(0, 80) || 'Награда';
  else S.prizes[+i].cost = Math.max(1, Math.min(999, parseInt(t.value, 10) || 1));
  save();
});
document.addEventListener('keydown', function (e) {
  if (ui.screen !== 'play' || ui.modal || !ui.run || e.ctrlKey || e.metaKey || e.altKey) return;
  var r = ui.run;
  if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { press('back'); e.preventDefault(); }
  else if (e.key === 'Enter') { if (r.phase === 'ask') press('ok'); else next(); e.preventDefault(); }
  else if (e.key === 'Tab' && r.phase === 'ask' && r.cur.type === 'num' && r.fields.length > 1) { r.active = (r.active + 1) % r.fields.length; paintFields(); e.preventDefault(); }
});

render();
})();
</script>
